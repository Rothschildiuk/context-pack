[package]
name = "context-pack"
version = "0.7.0"
edition = "2021"
description = "First-pass repository briefing for coding agents: instructions, commands, entry points, layout, key files, active work"
license = "MIT"

[dependencies]
globset = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
